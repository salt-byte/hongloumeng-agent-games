<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画里人家 · 红楼梦第四十回</title><link rel="stylesheet" href="style.css"></head>
<body>
<main id="game" aria-label="画里人家，叙事探索游戏">

<div id="grain"></div>
<section id="title" class="screen">
 <div class="title-panel"><div class="edition">一 日 游 园 · 一 席 人 情</div><div class="book">曹雪芹《红楼梦》</div><h1>画里<span>人家</span></h1><div class="red-seal">第四十回</div><div class="chapter">史太君两宴大观园<br>金鸳鸯三宣牙牌令</div><p class="title-desc">走进画里，也走进满园的笑声。<br>今日，你是刘姥姥。</p><button id="start" class="primary">入 园 <span>→</span></button><button id="resume" class="quiet hidden">续上这一日</button><div class="title-foot">叙事探索 · 五处园景 · 约十五分钟</div></div>
 <div class="title-verse">谁知我今儿进这园一瞧<br>竟比那画儿还强十倍</div><button id="about" class="title-about">游玩须知</button>
</section>

<div id="location-flash"></div><div id="toast" role="status"></div>
